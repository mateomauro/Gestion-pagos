[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: cualquier ruta no encontrada en /dist sirve index.html
# para que react-router maneje las rutas client-side (/login, /dashboard, etc).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache largo para assets versionados (Vite les pone hash al filename)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
